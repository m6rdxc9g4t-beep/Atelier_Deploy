# Suite Atelier sur un VPS : portail + Nexus, Viz, Tab, Convert, Projets, Wiki, Hub… derrière Caddy.
# Section « Sites & tests » du portail : Agent Ops Lab (service ops) et Atelier Mission (service mission).
# Cuisine, Dates et Suivi vivent sur Vercel uniquement : le portail les ouvre là-bas.
#
# Les apps se parlent en 127.0.0.1 (règle de la suite, vérifiée par Viz et Nexus) :
# elles partagent donc le réseau de l'hôte et n'écoutent que sur 127.0.0.1.
# Seul Caddy ouvre les ports 80 et 443 au monde.
# Exception : les sites publics qui n'appellent aucune app (Portfolio, Ops Lab) sont isolés sur leur propre réseau.
#
# Lancer :  docker compose up -d --build        Journal :  docker compose logs -f <service>
#
# Le VPS visé a 4 Go de mémoire : oom_score_adj dit au noyau qui épargner (Caddy, le portail, PostgreSQL) et qui
# sacrifier d'abord (Ollama, la démo publique) quand elle vient à manquer.
#
# Chaque service construit ici a une sonde (healthcheck) : update.sh attend qu'elle réponde avant d'annoncer une app
# « à jour », et remet l'image précédente sinon. start_interval (sondes toutes les 2 s pendant le démarrage)
# demande Docker 25 ou plus récent, ce que update.sh vérifie.

name: atelier

x-build: &build
  context: .
  args:
    ATELIER_DOMAIN: ${ATELIER_DOMAIN:?Renseigne ATELIER_DOMAIN dans .env}
    PROTO: ${PROTO:-https}

# IA : l'Ollama du serveur (service « ollama ») et un seul modèle pour toutes les apps.
# Chaque app lit le nom de variable qui la concerne ; les autres sont ignorés.
# Délais longs : sans carte graphique, une réponse peut prendre plusieurs minutes.
x-ia: &ia
  OLLAMA_URL: http://127.0.0.1:11434
  OLLAMA_BASE_URL: http://127.0.0.1:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1:8b}
  OLLAMA_TIMEOUT: "600"
  OLLAMA_TIMEOUT_SECONDS: "600"
  OLLAMA_TIMEOUT_MS: "600000"

x-journal: &journal
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

x-app: &app
  network_mode: host
  restart: unless-stopped
  # docker-init (tini) est le premier processus de chaque conteneur : il transmet SIGTERM à l'app (le portail, Ciné et
  # le Portfolio, lancés seuls, l'ignoraient : 10 s d'attente puis arrêt brutal à chaque redémarrage) et récupère les
  # processus orphelins (Tesseract, ffprobe, MCP de Tab).
  init: true
  environment: &tz
    TZ: ${TZ:-Europe/Paris}
  logging: *journal

# Sites publics (Portfolio, Ops Lab) : ouverts à tout Internet sans la connexion du portail. Ils ne partagent donc pas
# le réseau de l'hôte, où les apps privées répondent sans connexion sur 127.0.0.1 : une faille dans l'un d'eux ne
# donnerait accès ni à Trésorerie, ni au Wiki, ni à Ollama, ni à PostgreSQL. Réseau à part (« vitrine »), port publié
# sur 127.0.0.1 seulement (Caddy et les sondes du portail l'appellent comme avant), aucun privilège, mémoire et
# processus bornés.
x-vitrine: &vitrine
  restart: unless-stopped
  init: true
  networks: [vitrine]
  logging: *journal
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 256
  mem_limit: 512m

services:
  caddy:
    <<: *app
    build: { <<: *build, dockerfile: caddy/Dockerfile }
    oom_score_adj: -500   # dernier sacrifié si la mémoire manque : sans lui, plus aucune app n'est joignable
    environment:
      <<: *tz
      ATELIER_DOMAIN: ${ATELIER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Renseigne ACME_EMAIL dans .env}
      SITE_SCHEME: ${SITE_SCHEME:-}
      # Anciennes adresses dates.… et suivi.… : redirigées vers Vercel
      DATES_URL: ${DATES_URL:-https://atelier-dates.vercel.app}
      SUIVI_URL: ${SUIVI_URL:-https://atelier-suivi-bay.vercel.app}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [portail]
    # API d'administration de Caddy (127.0.0.1:2019, jamais exposée) : répond dès que la configuration est chargée.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  portail:
    <<: *app
    build: ./portail
    oom_score_adj: -500   # la connexion de toutes les apps passe par lui
    environment:
      <<: *tz
      ATELIER_DOMAIN: ${ATELIER_DOMAIN}
      SITE_SCHEME: ${PROTO:-https}
      PORTAL_USER: ${PORTAL_USER:-atelier}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:?Renseigne PORTAL_PASSWORD dans .env}
      SESSION_SECRET: ${SESSION_SECRET:?Renseigne SESSION_SECRET dans .env}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      CUISINE_URL: ${CUISINE_URL:-}
      SUIVI_URL: ${SUIVI_URL:-}
      DATES_URL: ${DATES_URL:-}
      # Vitrine pro : adresse publique du Portfolio et de ses démos (ex. relais Netlify), vide = portfolio.<domaine>.
      PORTFOLIO_PUBLIC_URL: ${PORTFOLIO_PUBLIC_URL:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/sante').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  viz:
    <<: *app
    build: { <<: *build, dockerfile: docker/viz.Dockerfile }
    environment:
      <<: [*tz, *ia]
      ALLOWED_HOSTS: viz.${ATELIER_DOMAIN}
      CLAUDE_MODE: ${VIZ_CLAUDE_MODE:-api}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${APPS_GITHUB_TOKEN:-}
    volumes:
      - ./data/viz:/data
      - ./data/atelier_tab:/data-tab:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  convert:
    <<: *app
    build: { <<: *build, dockerfile: docker/convert.Dockerfile }
    environment:
      <<: [*tz, *ia]
      ALLOWED_HOSTS: convert.${ATELIER_DOMAIN}
      CLAUDE_MODE: api
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./data/convert:/data
      # « Envoyer dans Atelier Tab » écrit dans les fichiers de Tab côté serveur (ceux du MCP de Tab, pour Nexus).
      - ./data/atelier_tab:/data-tab
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  # Sites & tests — DataMind (dépôt Agent_Data) : agent d'analyse de données, API Fastify + DuckDB et interface React
  # sur 127.0.0.1:3600. Claude avec ton forfait (DATAMIND_CLAUDE_OAUTH_TOKEN, sans clé API, usage personnel),
  # sinon l'IA du serveur. Jeux de données et analyses dans data/datamind.
  datamind:
    <<: *app
    build: { <<: *build, dockerfile: docker/datamind.Dockerfile }
    # Nom fixe : la démo publique (datamind-demo) réutilise cette image, sans en construire une deuxième.
    image: atelier-datamind
    environment:
      <<: [*tz, *ia]
      HOST: 127.0.0.1
      PORT: "3600"
      DATAMIND_ENGINE: ${DATAMIND_ENGINE:-}
      DATAMIND_INSTANCE_LABEL: Sites & tests
      # Forfait Claude (Pro / Max) : jeton de « claude setup-token ». Prioritaire sur la clé API.
      CLAUDE_CODE_OAUTH_TOKEN: ${DATAMIND_CLAUDE_OAUTH_TOKEN:-}
      OLLAMA_NUM_CTX: "8192"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATAMIND_CLAUDE_MODEL: ${DATAMIND_CLAUDE_MODEL:-claude-sonnet-5-5}
    volumes:
      - ./data/datamind:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3600/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  # Vitrine pro — démo publique de DataMind (https://demo-datamind.<domaine>, sans connexion) : la MÊME image que
  # datamind (construite par lui, jamais ici), lancée en mode démo : 16 jeux d'exemple copiés au démarrage dans un
  # tmpfs, rien d'autre n'est écrit, sessions isolées par visiteur, IA du serveur seulement (aucun jeton ni clé Claude),
  # DATAMIND_DEMO_QUESTIONS_PAR_HEURE questions par heure et par visiteur, une à la fois.
  # Réseau de l'hôte : Caddy arrive de 127.0.0.1, seule origine dont l'app croit X-Forwarded-For (quota par visiteur).
  datamind-demo:
    <<: *app
    image: atelier-datamind
    pull_policy: never
    environment:
      <<: [*tz, *ia]
      HOST: 127.0.0.1
      PORT: "3601"
      DATA_DIR: /data
      DATAMIND_DEMO: "1"
      DATAMIND_DEMO_QUESTIONS_PAR_HEURE: ${DATAMIND_DEMO_QUESTIONS_PAR_HEURE:-10}
      # Lien « Portfolio » de la démo : adresse publique du Portfolio (relais Netlify), sinon portfolio.<domaine>.
      DATAMIND_DEMO_RETOUR: ${PORTFOLIO_PUBLIC_URL:-${PROTO:-https}://portfolio.${ATELIER_DOMAIN}}
      DATAMIND_INSTANCE_LABEL: Démo publique
      DATAMIND_ENGINE: ollama
      OLLAMA_NUM_CTX: "8192"
    # Données éphémères : rien sur le disque, tout disparaît au redémarrage (utilisateur node, uid 1000).
    tmpfs:
      - /data:size=128m,uid=1000,gid=1000,mode=0700
    # Service public : mémoire et processus bornés, aucun privilège ; sacrifié avant les apps privées si la mémoire manque.
    oom_score_adj: 500
    mem_limit: 768m
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3601/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  projets:
    <<: *app
    build: { <<: *build, dockerfile: docker/projets.Dockerfile }
    environment:
      <<: [*tz, *ia]
      ALLOWED_HOSTS: projets.${ATELIER_DOMAIN}
      APP_TIMEZONE: ${TZ:-Europe/Paris}
      ATELIER_IMPORT_TOKEN: ${ATELIER_IMPORT_TOKEN:-}
      OLLAMA_NUM_CTX: "8192"
      GITHUB_TOKEN: ${APPS_GITHUB_TOKEN:-}
    volumes:
      - ./data/projets:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      start_interval: 2s

  wiki:
    <<: *app
    build: { <<: *build, dockerfile: docker/wiki.Dockerfile }
    environment:
      <<: [*tz, *ia]
      ALLOWED_HOSTS: wiki.${ATELIER_DOMAIN}
      WIKI_PUBLIC_URL: ${PROTO:-https}://wiki.${ATELIER_DOMAIN}
    volumes:
      - ./data/wiki:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3200/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  # Atelier Hub : une fiche par projet. Lit Projets, Wiki, Viz, Convert et Nexus en 127.0.0.1 (lecture seule)
  # et l'index de Tab (fichiers du MCP de Tab) ; les liens ouvrent les sous-domaines de la suite.
  hub:
    <<: *app
    build: { <<: *build, dockerfile: docker/hub.Dockerfile }
    environment:
      <<: *tz
      ALLOWED_HOSTS: hub.${ATELIER_DOMAIN}
      PROJETS_URL: ${PROTO:-https}://projets.${ATELIER_DOMAIN}
      WIKI_URL: ${PROTO:-https}://wiki.${ATELIER_DOMAIN}
      VIZ_URL: ${PROTO:-https}://viz.${ATELIER_DOMAIN}
      CONVERT_URL: ${PROTO:-https}://convert.${ATELIER_DOMAIN}
      NEXUS_URL: ${PROTO:-https}://nexus.${ATELIER_DOMAIN}
      TAB_URL: ${PROTO:-https}://tab.${ATELIER_DOMAIN}
    volumes:
      - ./data/hub:/data
      - ./data/atelier_tab/exports:/tab-exports:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3700/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  formulaire:
    <<: *app
    build: { <<: *build, dockerfile: docker/formulaire.Dockerfile }
    environment:
      <<: [*tz, *ia]
      ALLOWED_HOSTS: formulaire.${ATELIER_DOMAIN}
      FORMULAIRE_PUBLIC_URL: ${PROTO:-https}://formulaire.${ATELIER_DOMAIN}
    volumes:
      - ./data/formulaire:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3300/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  # Portfolio : site public (vitrine pour les recruteurs), sans la connexion du portail.
  portfolio:
    <<: *vitrine
    build:
      <<: *build
      dockerfile: docker/portfolio.Dockerfile
      args:
        ATELIER_DOMAIN: ${ATELIER_DOMAIN:?Renseigne ATELIER_DOMAIN dans .env}
        PROTO: ${PROTO:-https}
        # Observatoire immobilier : clé de cache des données DVF (mois courant, posé par update.sh).
        DVF_CACHE_KEY: ${DVF_CACHE_KEY:-}
        DVF_DEPARTEMENTS: ${DVF_DEPARTEMENTS:-49,62,59,44,35}
    environment:
      <<: *tz
      # Dans son conteneur, le serveur écoute sur toutes les interfaces ; l'hôte ne publie le port que sur 127.0.0.1.
      HOST: 0.0.0.0
      # Relais Netlify (netlify/portfolio) : secret partagé pour reconnaître l'adresse réelle des visiteurs.
      NETLIFY_PROXY_SECRET: ${PORTFOLIO_PROXY_SECRET:-}
    ports: ["127.0.0.1:8787:8787"]
    volumes:
      - ./data/portfolio:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  # Agent Ops Lab : TMS simulé piloté par un agent IA (tout tourne dans le navigateur), public comme le Portfolio.
  ops:
    <<: *vitrine
    build: { <<: *build, dockerfile: docker/ops.Dockerfile }
    environment:
      <<: *tz
      # Next.js autonome lit HOSTNAME : toutes les interfaces du conteneur, port publié sur 127.0.0.1 seulement.
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3400:3400"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3400/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  # ── Sites & tests : simulations et maquettes, derrière la connexion du portail ──
  # Atelier Mission : mini-CRM freelance (prospects, devis, factures, relances), API + interface sur :3500.
  # Lit le temps dans Projets (127.0.0.1:3000) et écrit les encaissements dans Trésorerie (127.0.0.1:5050).
  # Brevo et SUPER PDP : identifiants facultatifs, utilisés seulement en mode « En ligne » de l'app.
  mission:
    <<: *app
    build: { <<: *build, dockerfile: docker/mission.Dockerfile }
    environment:
      <<: *tz
      ALLOWED_HOSTS: mission.${ATELIER_DOMAIN}
      BREVO_API_KEY: ${MISSION_BREVO_API_KEY:-}
      SUPERPDP_CLIENT_ID: ${MISSION_SUPERPDP_CLIENT_ID:-}
      SUPERPDP_CLIENT_SECRET: ${MISSION_SUPERPDP_CLIENT_SECRET:-}
      SUPERPDP_URL: ${MISSION_SUPERPDP_URL:-}
      REMINDER_TICK_MINUTES: "15"
    volumes:
      - ./data/mission:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3500/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  nexus-backend:
    <<: *app
    build: { <<: *build, dockerfile: docker/nexus-backend.Dockerfile }
    environment:
      <<: [*tz, *ia]
      TIMEZONE: ${TZ:-Europe/Paris}
      CORS_ORIGINS: ${PROTO:-https}://nexus.${ATELIER_DOMAIN}
      DATABASE_URL: postgresql+asyncpg://nexus:${POSTGRES_PASSWORD:?Renseigne POSTGRES_PASSWORD dans .env}@127.0.0.1:5433/atelier_nexus
      DB_AUTO_MIGRATE: "true"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODE: api
      LLM_DEFAULT_PROVIDER: ${NEXUS_LLM_PROVIDER:-ollama}
      PROJETS_IMPORT_TOKEN: ${ATELIER_IMPORT_TOKEN:-}
      GITHUB_TOKEN: ${APPS_GITHUB_TOKEN:-}
      # Autres ateliers hébergés sur ce VPS (vide = désactivé)
      CINE_BASE_URL: http://127.0.0.1:4000/api
      SAVOIR_BASE_URL: http://127.0.0.1:5051/api
      TRESORERIE_BASE_URL: http://127.0.0.1:5050/api
    volumes:
      - ./data/nexus:/data/nexus
      - ./data/atelier_tab:/data/atelier_tab
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      start_interval: 2s

  nexus-frontend:
    <<: *app
    build: { <<: *build, dockerfile: docker/nexus-frontend.Dockerfile }
    depends_on: [nexus-backend]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      start_interval: 2s

  cine:
    <<: *app
    build: { <<: *build, dockerfile: docker/cine.Dockerfile }
    environment:
      <<: [*tz, *ia]
      CORS_ORIGIN: ${PROTO:-https}://cine.${ATELIER_DOMAIN}
      SCAN_PROBE: "true"
    volumes:
      - ./data/cine:/data
      # Dépose tes vidéos dans media/films et media/series (sur le VPS)
      - ./media/films:/media/films:ro
      - ./media/series:/media/series:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  savoir:
    <<: *app
    build: { <<: *build, dockerfile: docker/savoir.Dockerfile }
    environment:
      <<: [*tz, *ia]
      SECRET_KEY: ${APPS_SECRET_KEY:?Renseigne APPS_SECRET_KEY dans .env (sudo ./install.sh le génère)}
    volumes:
      - ./data/savoir:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5051/api/stats',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  tresorerie:
    <<: *app
    build: { <<: *build, dockerfile: docker/tresorerie.Dockerfile }
    environment:
      <<: [*tz, *ia]
      SECRET_KEY: ${APPS_SECRET_KEY}
    volumes:
      - ./data/tresorerie:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5050/api/ping',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      start_interval: 2s

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    logging: *journal
    oom_score_adj: -500   # la base de Nexus ne doit pas être tuée en pleine écriture
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: atelier_nexus
      TZ: ${TZ:-Europe/Paris}
    # Publié sur 127.0.0.1 seulement (5433 pour ne pas gêner un PostgreSQL déjà installé)
    ports: ["127.0.0.1:5433:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/atelier_nexus/backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d atelier_nexus"]
      interval: 10s
      timeout: 5s
      retries: 10

  # IA du serveur, partagée par toutes les apps (et par Tab via https://tab.<domaine>/ollama/).
  # Le modèle (OLLAMA_MODEL dans .env) est choisi selon la mémoire et téléchargé par install.sh / update.sh.
  ollama:
    <<: *app
    image: ollama/ollama:latest
    # Le plus gros consommateur de mémoire (le modèle chargé) : s'il faut tuer un processus, que ce soit lui.
    # Il redémarre seul et recharge le modèle à la demande suivante.
    oom_score_adj: 500
    environment:
      <<: *tz
      OLLAMA_HOST: 127.0.0.1:11434
      # Un seul modèle en mémoire, une requête à la fois : le serveur n'a pas de carte graphique.
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      start_interval: 2s

networks:
  # Réseau des sites publics : sans PostgreSQL (réseau par défaut) et hors du réseau de l'hôte.
  vitrine:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  ollama_data:
