<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suite Atelier</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='12' height='12' rx='4' fill='%23E8590C'/%3E%3Crect x='18' y='2' width='12' height='12' rx='4' fill='%23F2C811'/%3E%3Crect x='2' y='18' width='12' height='12' rx='4' fill='%2321A366'/%3E%3Crect x='18' y='18' width='12' height='12' rx='4' fill='%2394D82D'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#FAF7F4; --surface:#FFFFFF; --surface-2:#F4EEE9;
  --fg:#1E1611; --muted:#6B5D54; --faint:#A39388;
  --line:rgba(34,20,13,.12); --grid:rgba(34,20,13,.045);
  --up:#2F8F5B; --down:#C2410C; --partial:#B7791F;
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F0C0A; --surface:#17120F; --surface-2:#1F1814;
  --fg:#F4ECE6; --muted:#B3A398; --faint:#76665C;
  --line:rgba(255,236,224,.11); --grid:rgba(255,236,224,.035);
  --up:#6FD39B; --down:#FF8A5C; --partial:#F5C26B;
}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  color:var(--fg);font:15px/1.5 var(--f-body);
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
}
.wrap{max-width:1040px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:28px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.mark{display:grid;grid-template-columns:repeat(2,12px);gap:3px}
.mark i{width:12px;height:12px;border-radius:4px;display:block}
h1{font:900 22px/1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--faint);font-weight:800}
.who{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}
.who form{margin:0}
button.ghost{font:600 13px var(--f-body);color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
button.ghost:hover,button.ghost:focus-visible{color:var(--fg);border-color:var(--fg);outline:none}

.intro h2{font:800 clamp(26px,4vw,36px)/1.1 var(--f-display);margin:0 0 6px;letter-spacing:-.01em;text-wrap:balance}
.intro p{margin:0;color:var(--muted)}

.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:16px}
.app{
  --sig:#888;position:relative;display:flex;flex-direction:column;gap:14px;min-height:190px;
  padding:20px;border-radius:20px;text-decoration:none;color:inherit;
  background:var(--surface);border:1px solid var(--line);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.app::after{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 2px var(--sig),0 10px 40px -8px color-mix(in oklab,var(--sig) 55%,transparent);opacity:0;transition:opacity .18s ease}
.app:hover,.app:focus-visible{transform:translateY(-3px);outline:none}
.app:hover::after,.app:focus-visible::after{opacity:1}
.app.last{border-color:color-mix(in oklab,var(--sig) 60%,var(--line))}
.top{display:flex;align-items:center;justify-content:space-between}
.tile{width:46px;height:46px;border-radius:14px;background:var(--sig);display:grid;place-items:center;font:900 20px var(--f-display);color:#1E1611;box-shadow:0 0 18px color-mix(in oklab,var(--sig) 55%,transparent)}
.key{font:600 12px var(--f-mono);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.app h3{font:800 22px/1.1 var(--f-display);margin:0}
.app p{margin:4px 0 0;color:var(--muted);font-size:14px}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.state{display:inline-flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--faint)}
.state[data-s="up"] .dot{background:var(--up);box-shadow:0 0 0 3px color-mix(in oklab,var(--up) 22%,transparent)}
.state[data-s="down"] .dot{background:var(--down)}
.state[data-s="partial"] .dot{background:var(--partial)}
.host{font:12px var(--f-mono);color:var(--faint);overflow-wrap:anywhere}
.badge{font:700 11px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--sig);background:color-mix(in oklab,var(--sig) 14%,transparent);border-radius:6px;padding:2px 7px}
@media (prefers-color-scheme: dark){.badge{color:color-mix(in oklab,var(--sig) 85%,white)}}

.options{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;color:var(--muted);font-size:14px}
.options label{display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.options input{accent-color:#E8590C;width:16px;height:16px}
.refresh{margin-left:auto;font:12px var(--f-mono);color:var(--faint)}
footer{margin-top:auto;color:var(--faint);font-size:13px}
kbd{font:12px var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
@media (prefers-reduced-motion: reduce){.app,.app::after{transition:none}.app:hover{transform:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"><i style="background:#E8590C"></i><i style="background:#F2C811"></i><i style="background:#21A366"></i><i style="background:#94D82D"></i></span>
      <h1>Suite <span>Atelier</span></h1>
    </div>
    <div class="who">
      <span>Connecté : <strong>{{UTILISATEUR}}</strong></span>
      <form method="post" action="/deconnexion"><button class="ghost" type="submit">Se déconnecter</button></form>
    </div>
  </header>

  <section class="intro">
    <h2>Quelle app ouvrir&nbsp;?</h2>
    <p>Choisis une app, ou tape son numéro au clavier. Tu restes connecté sur toutes les apps de la suite.</p>
  </section>

  <nav class="apps" id="apps" aria-label="Apps de la suite"></nav>

  <div class="options">
    <label><input type="checkbox" id="newtab"> Ouvrir dans un nouvel onglet</label>
    <span class="refresh" id="refresh" aria-live="polite">État en cours de vérification…</span>
  </div>

  <footer>{{DOMAINE}} · <kbd>1</kbd>–<kbd>4</kbd> pour ouvrir une app</footer>
</div>

<script>
const APPS = /*APPS*/[];
const LABELS = { up: 'En ligne', down: 'Hors ligne', partial: 'Démarrage partiel', unknown: 'Vérification…' };

const store = {
  get(k){ try { return localStorage.getItem(k) } catch { return null } },
  set(k,v){ try { localStorage.setItem(k,v) } catch {} },
};

const nav = document.getElementById('apps');
const newtab = document.getElementById('newtab');
newtab.checked = store.get('atelier:newtab') === '1';
newtab.addEventListener('change', () => { store.set('atelier:newtab', newtab.checked ? '1' : '0'); render() });

function render(statuses = {}) {
  const last = store.get('atelier:last');
  nav.innerHTML = '';
  APPS.forEach((a, i) => {
    const s = statuses[a.id] || { state: 'unknown' };
    const el = document.createElement('a');
    el.className = 'app' + (a.id === last ? ' last' : '');
    el.href = a.url;
    el.style.setProperty('--sig', a.color);
    if (newtab.checked) { el.target = '_blank'; el.rel = 'noopener' }
    el.innerHTML = `
      <div class="top"><span class="tile" aria-hidden="true">${a.name[0]}</span><span class="key" aria-hidden="true">${i + 1}</span></div>
      <div><h3>${a.name}</h3><p>${a.role}</p></div>
      <div class="foot">
        <span class="state" data-s="${s.state}"><span class="dot" aria-hidden="true"></span>${LABELS[s.state]}${s.ms != null ? ` · ${s.ms} ms` : ''}</span>
        ${a.id === last ? '<span class="badge">Dernière</span>' : `<span class="host">${new URL(a.url).host}</span>`}
      </div>`;
    el.addEventListener('click', () => store.set('atelier:last', a.id));
    nav.appendChild(el);
  });
}

async function refresh() {
  const label = document.getElementById('refresh');
  try {
    const res = await fetch('/api/statut', { cache: 'no-store' });
    if (res.status === 401) return location.assign('/connexion');
    const data = await res.json();
    render(Object.fromEntries(data.apps.map(s => [s.id, s])));
    const down = data.apps.filter(s => s.state !== 'up').length;
    label.textContent = (down ? `${down} app(s) indisponible(s)` : 'Toutes les apps sont en ligne') + ` · vérifié à ${new Date(data.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
  } catch {
    label.textContent = 'Impossible de vérifier l’état des apps';
  }
}

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea')) return;
  const a = APPS[Number(e.key) - 1];
  if (!a) return;
  store.set('atelier:last', a.id);
  if (newtab.checked) window.open(a.url, '_blank', 'noopener'); else location.assign(a.url);
});

render();
refresh();
setInterval(() => { if (!document.hidden) refresh() }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh() });
</script>
</body>
</html>
