<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suite Atelier</title>
<link rel="icon" type="image/png" href="/icones/favicon-64.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-title" content="Suite Atelier">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Thème de la suite : cookie atelier_theme (system|light|dark) partagé par tous les sous-domaines. */
(function(){
  var m = document.cookie.match(/(?:^|; )atelier_theme=(light|dark|system)/);
  var pref = m ? m[1] : 'system';
  var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.themePref = pref;
})();
</script>
<link rel="stylesheet" href="/atelier.css?v=2">
<style>
/* Portail : ce qui n'appartient qu'à cette page. Le reste vient d'atelier.css. */
.search {
  display: flex; align-items: center; gap: 8px; height: 30px; margin: 0 0 10px; padding: 0 6px 0 9px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--faint);
  transition: border-color var(--t-fast), box-shadow var(--t-fast);
}
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: 0; background: transparent; font: 400 var(--t-base) var(--font); color: var(--ink); }
.search input::placeholder { color: var(--faint); }
.search input::-webkit-search-cancel-button { display: none; }
.search .at-kbd { border-bottom-width: 1px; }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; padding-top: 12px; }
.theme { align-self: flex-start; margin-left: 4px; }
.theme button { padding: 0 7px; }
.me { display: flex; align-items: center; gap: 9px; padding: 4px 4px 4px 8px; border-radius: var(--r-md); }
.avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 600; color: var(--ink); background: var(--selected); box-shadow: inset 0 0 0 1px var(--line-strong); }
.me #user { flex: 1; min-width: 0; font-weight: 500; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.me form { margin: 0; }

.health { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: var(--t-small); white-space: nowrap; }
.health b { font-weight: 500; color: var(--ink-2); }
#health-state { display: inline-flex; align-items: center; gap: 8px; }
#health-time:not(:empty)::before { content: "· "; }
#refresh.is-busy .ic { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Lignes */
.at-row { grid-template-columns: 22px 20px minmax(150px, 220px) minmax(0, 1fr) 150px 64px 24px; }
.k { font-size: var(--t-meta); color: var(--faint); text-align: center; font-variant-numeric: tabular-nums; }
.name { font-weight: 500; font-size: var(--t-base); color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.role { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ms { text-align: right; color: var(--muted); font-size: var(--t-small); font-variant-numeric: tabular-nums; }
.go { color: var(--faint); opacity: 0; transform: translateX(-3px); transition: opacity var(--t-fast), transform var(--t-med) var(--ease-out); }
.at-row.is-sel .go, .tile.is-sel .go { opacity: 1; transform: none; color: var(--accent); }
.ext-mark { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: var(--t-small); }
.ext-mark .ic { width: 13px; height: 13px; }
.last { font-size: var(--t-meta); color: var(--accent); font-weight: 500; margin-left: 6px; }

/* Ligne et tuile : lien étiré sur toute la surface, bouton de copie au-dessus */
.at-row, .tile { position: relative; cursor: pointer; }
.row-link { color: inherit; text-decoration: none; }
.row-link::after { content: ""; position: absolute; inset: 0; }
.row-link:focus-visible { outline: none; }
.at-row:has(.row-link:focus-visible), .tile:has(.row-link:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.pub { margin-left: 8px; padding: 1px 6px; font-size: var(--t-meta); font-weight: 500; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; vertical-align: 1px; }
.copy {
  position: relative; z-index: 1; display: inline-grid; place-items: center; width: 24px; height: 24px; margin-left: -4px;
  color: var(--faint); background: transparent; border: 0; border-radius: var(--r-sm); cursor: pointer;
  transition: background var(--t-fast), color var(--t-fast);
}
.copy:hover, .copy:focus-visible { color: var(--ink); background: var(--selected); }
.copy.is-done { color: var(--accent); }
.tile .foot .copy { margin-left: auto; }
.tile .foot .pub { margin-left: 0; }
.notice { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); margin: 0; padding: 8px 14px; font-size: var(--t-small);
  color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); box-shadow: var(--shadow-pop); z-index: 5; }
.notice:empty { display: none; }

/* Icônes */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 8px; padding: 14px 20px 22px; }
.tile {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; padding: 14px 14px 12px;
  color: inherit; text-decoration: none; border-radius: var(--r-lg); border: 1px solid transparent;
  transition: background var(--t-fast), border-color var(--t-fast);
}
.tile:hover { background: var(--hover); }
.tile.is-sel { background: var(--accent-soft); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
.tile .k { position: absolute; top: 10px; right: 10px; }
.tile .name { font-size: var(--t-strong); display: block; white-space: normal; line-height: 1.25; }
.tile-text { display: block; width: 100%; min-width: 0; }
.tile .role { white-space: normal; font-size: var(--t-small); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; min-height: 2.7em; }
.tile .foot { display: flex; align-items: center; gap: 8px; width: 100%; }
.tile .foot { min-height: 18px; }
.tile .foot .ms { text-align: left; }
.tile .go { position: absolute; right: 12px; bottom: 12px; }

.empty { padding: 56px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-weight: 600; font-size: var(--t-title); margin-bottom: 4px; }
.empty .at-btn { margin-top: 14px; }
.hint { padding: 16px 20px 28px; color: var(--faint); font-size: var(--t-small); display: flex; flex-wrap: wrap; gap: 6px 18px; }
.hint span { display: inline-flex; align-items: center; gap: 5px; }

/* Arrivée : le contenu est visible d'emblée, seul un léger glissé l'accompagne. */
@media (prefers-reduced-motion: no-preference) {
  .at-main.is-ready #content { animation: arrive 360ms var(--ease-out); }
}
@keyframes arrive { from { transform: translateY(4px); } to { transform: none; } }

/* Fenêtre étroite : la barre latérale passe en haut */
@media (max-width: 760px) {
  :root { --t-base: 14px; --row-h: 52px; }
  .at-shell { grid-template-columns: 1fr; background: none; }
  .at-side { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px; padding: max(10px, env(safe-area-inset-top)) 14px 10px; border-right: 0; border-bottom: 1px solid var(--line); }
  .at-ws { padding: 0; flex: 1; }
  .search { order: 3; flex-basis: 100%; height: 36px; margin: 0; }
  .search .at-kbd { display: none; }
  .at-nav { order: 4; flex-basis: 100%; flex-direction: row; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px; }
  .at-nav-sec { display: none; }
  .at-nav-item { width: auto; flex: none; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; }
  .at-nav-item .at-count { margin-left: 2px; }
  .at-nav-item .ic { display: none; }
  .at-nav-item[data-filter="incidents"] { order: -1; }
  .at-nav-item[data-filter="all"] { order: -2; }
  .at-top h1 { display: none; }
  .side-foot { order: 2; margin: 0; padding: 0; flex-direction: row; align-items: center; gap: 4px; }
  .me #user { display: none; }
  .me { padding: 0; }
  .at-top { top: 0; padding: 0 14px; flex-wrap: wrap; }
  .at-top .at-check, .hint, #refresh { display: none; }
  .at-ghead { position: static; padding: 9px 14px; }
  .at-top { position: static; padding: 6px 14px; }
  .at-row { grid-template-columns: 28px minmax(0, 1fr) auto; padding: 8px 14px; gap: 12px; }
  .at-row .at-appicon { --size: 28px; border-radius: var(--r-md); }
  .at-row .k, .at-row .ms, .at-row .go { display: none; }
  .at-row .copy { width: 36px; height: 36px; }
  .at-row .name-role { display: flex; flex-direction: column; min-width: 0; }
  .at-row .role { font-size: var(--t-small); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 12px 14px 20px; }
  .tile .k { display: none; }
}
@media (min-width: 761px) { .at-row .name-role { display: contents; } }
</style>
</head>
<body>
{{ICONES}}
<div class="at-shell">
  <aside class="at-side" aria-label="Navigation de la suite">
    <div class="at-ws"><svg aria-hidden="true"><use href="#atelier-mark"/></svg>Suite Atelier</div>

    <label class="search">
      <svg class="ic" aria-hidden="true"><use href="#i-search"/></svg>
      <span class="sr-only">Rechercher une app</span>
      <input id="q" type="search" placeholder="Ouvrir une app…" autocomplete="off" spellcheck="false">
      <kbd class="at-kbd">⌘K</kbd>
    </label>

    <nav class="at-nav" id="filters" aria-label="Filtres">
      <button class="at-nav-item" data-filter="all"><svg class="ic" aria-hidden="true"><use href="#i-layers"/></svg>Toutes les apps<span class="at-count" data-count="all"></span></button>
      <button class="at-nav-item" data-filter="recent"><svg class="ic" aria-hidden="true"><use href="#i-clock"/></svg>Récentes<span class="at-count" data-count="recent"></span></button>
      <button class="at-nav-item" data-filter="incidents"><svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>Incidents<span class="at-count" data-count="incidents"></span></button>
      <div class="at-nav-sec">Groupes</div>
      <button class="at-nav-item" data-filter="vps"><svg class="ic" aria-hidden="true"><use href="#i-server"/></svg>Sur le serveur<span class="at-count" data-count="vps"></span></button>
      <button class="at-nav-item" data-filter="vitrine"><svg class="ic" aria-hidden="true"><use href="#i-briefcase"/></svg>Vitrine pro<span class="at-count" data-count="vitrine"></span></button>
      <button class="at-nav-item" data-filter="sites"><svg class="ic" aria-hidden="true"><use href="#i-flask"/></svg>Sites &amp; tests<span class="at-count" data-count="sites"></span></button>
      <button class="at-nav-item" data-filter="online"><svg class="ic" aria-hidden="true"><use href="#i-globe"/></svg>En ligne<span class="at-count" data-count="online"></span></button>
    </nav>

    <div class="side-foot">
      <div class="at-seg theme" role="group" aria-label="Thème">
        <button type="button" data-theme-set="system" title="Thème du système"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-monitor"/></svg><span class="sr-only">Système</span></button>
        <button type="button" data-theme-set="light" title="Thème clair"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-sun"/></svg><span class="sr-only">Clair</span></button>
        <button type="button" data-theme-set="dark" title="Thème sombre"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-moon"/></svg><span class="sr-only">Sombre</span></button>
      </div>
      <div class="me">
        <span class="avatar" aria-hidden="true" id="initial"></span>
        <span id="user">{{UTILISATEUR}}</span>
        <form method="post" action="/deconnexion"><button class="at-btn at-btn--ghost at-btn--icon" type="submit" title="Se déconnecter"><svg class="ic" aria-hidden="true"><use href="#i-logout"/></svg><span class="sr-only">Se déconnecter</span></button></form>
      </div>
    </div>
  </aside>

  <main class="at-main" id="main">
    <header class="at-top">
      <h1 id="title">Toutes les apps</h1>
      <div class="at-seg" role="group" aria-label="Affichage">
        <button type="button" data-view="list"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-list"/></svg>Liste</button>
        <button type="button" data-view="grid"><svg class="ic ic-sm" aria-hidden="true"><use href="#i-grid"/></svg>Icônes</button>
      </div>
      <span class="at-spacer"></span>
      <label class="at-check"><input type="checkbox" id="newtab">Nouvel onglet</label>
      <span class="health" id="health"><span id="health-state" role="status" aria-live="polite"><span class="at-state" data-s="unknown"></span>Vérification…</span><span class="num" id="health-time"></span></span>
      <button class="at-btn at-btn--ghost at-btn--icon" id="refresh" type="button" title="Vérifier maintenant"><svg class="ic" aria-hidden="true"><use href="#i-refresh"/></svg><span class="sr-only">Vérifier maintenant</span></button>
    </header>
    <div id="content"></div>
    <p class="notice" id="notice" role="status" aria-live="polite"></p>
    <div class="hint" aria-hidden="true">
      <span><kbd class="at-kbd">1</kbd>–<kbd class="at-kbd">0</kbd> ouvrir</span>
      <span><kbd class="at-kbd">↑</kbd><kbd class="at-kbd">↓</kbd> choisir</span>
      <span><kbd class="at-kbd">↵</kbd> ouvrir · <kbd class="at-kbd">⌘</kbd><kbd class="at-kbd">↵</kbd> nouvel onglet</span>
      <span><kbd class="at-kbd">⌘K</kbd> rechercher</span>
      <span><kbd class="at-kbd">C</kbd> copier un lien public</span>
      <span>{{DOMAINE}}</span>
    </div>
  </main>
</div>

<script>
const APPS = /*APPS*/[];
const DOMAIN = '{{DOMAINE}}';
const GROUPS = [
  { id: 'vps', title: 'Sur le serveur', note: 'derrière la connexion du portail' },
  { id: 'vitrine', title: 'Vitrine pro', note: 'public, à montrer aux recruteurs et aux clients' },
  { id: 'sites', title: 'Sites & tests', note: 'simulations, maquettes et essais' },
  { id: 'online', title: 'En ligne', note: 'Vercel, avec leur propre connexion' },
];
const TITLES = { all: 'Toutes les apps', recent: 'Récentes', incidents: 'Incidents', vps: 'Sur le serveur', vitrine: 'Vitrine pro', sites: 'Sites & tests', online: 'En ligne' };
const LABELS = { up: 'En ligne', down: 'Hors ligne', partial: 'Démarrage partiel', unknown: 'Vérification…' };

const store = {
  get(k) { try { return localStorage.getItem(k) } catch { return null } },
  set(k, v) { try { localStorage.setItem(k, v) } catch {} },
};
const groupOf = (a) => (a.external ? 'online' : a.group === 'sites' || a.group === 'vitrine' ? a.group : 'vps');
APPS.forEach((a, i) => { a.key = i < 10 ? (i === 9 ? '0' : String(i + 1)) : ''; a.grp = groupOf(a) });

const $ = (s) => document.querySelector(s);
const content = $('#content');
const q = $('#q');
const newtab = $('#newtab');
let statuses = {};
let filter = store.get('atelier:filter');
if (!TITLES[filter]) filter = 'all'; // un filtre d'une ancienne version du portail
let view = store.get('atelier:view') === 'grid' ? 'grid' : 'list';
let sel = 0;
let visible = [];

$('#initial').textContent = ($('#user').textContent.trim()[0] || '?').toUpperCase();
newtab.checked = store.get('atelier:newtab') === '1';
newtab.addEventListener('change', () => { store.set('atelier:newtab', newtab.checked ? '1' : '0'); render() });

// ── Thème ──
function setTheme(pref) {
  const dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  document.documentElement.dataset.themePref = pref;
  const secure = location.protocol === 'https:' ? '; Secure' : '';
  document.cookie = `atelier_theme=${pref}; Domain=${DOMAIN}; Path=/; Max-Age=31536000; SameSite=Lax${secure}`;
  document.querySelectorAll('[data-theme-set]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.themeSet === pref)));
}
document.querySelectorAll('[data-theme-set]').forEach((b) => b.addEventListener('click', () => setTheme(b.dataset.themeSet)));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (document.documentElement.dataset.themePref === 'system') setTheme('system') });
setTheme(document.documentElement.dataset.themePref || 'system');

// ── Récentes ──
const recents = () => (store.get('atelier:recents') || '').split(',').filter((id) => APPS.some((a) => a.id === id));
function noteOpen(a) {
  store.set('atelier:recents', [a.id, ...recents().filter((id) => id !== a.id)].slice(0, 6).join(','));
  store.set('atelier:last', a.id);
}

const stateOf = (a) => (a.external ? 'ext' : (statuses[a.id] || { state: 'unknown' }).state);
const isIncident = (a) => !a.external && ['down', 'partial'].includes(stateOf(a));
const norm = (s) => s.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase();

function selectApps() {
  const term = norm(q.value.trim());
  if (term) {
    // Rang : début du nom, puis nom, puis début d'un mot du rôle.
    const rank = (a) => {
      const n = norm(a.name), words = norm(a.role).split(/[^a-z0-9]+/);
      return n.startsWith(term) ? 0 : n.includes(term) ? 1 : words.some((w) => w.startsWith(term)) ? 2 : 9;
    };
    return APPS.map((a) => ({ a, r: rank(a) })).filter((x) => x.r < 9).sort((x, y) => x.r - y.r).map((x) => x.a);
  }
  if (filter === 'recent') { const r = recents(); return r.map((id) => APPS.find((a) => a.id === id)) }
  if (filter === 'incidents') return APPS.filter(isIncident);
  if (filter === 'all') return APPS;
  return APPS.filter((a) => a.grp === filter);
}

function stateHtml(a, short = false) {
  if (a.external) return a.url
    ? `<span class="ext-mark">Vercel<svg class="ic" aria-hidden="true"><use href="#i-external"/></svg></span>`
    : `<span class="at-state" data-s="unknown">Adresse à renseigner</span>`;
  const s = stateOf(a);
  if (s === 'up') return '<span></span>';
  return `<span class="at-state" data-s="${s}">${short && s === 'partial' ? 'Partiel' : LABELS[s]}</span>`;
}
function msHtml(a) {
  const s = statuses[a.id];
  if (a.external || !s) return '';
  if (s.state !== 'up') return '—';
  return s.ms != null ? `${s.ms} ms` : 'statique';
}
const icon = (a, size = '') => `<span class="at-appicon ${size}" style="--app:${a.color}" aria-hidden="true"><svg><use href="#app-${a.icon || a.id}"/></svg></span>`;
const goIcon = (a) => `<svg class="ic go" aria-hidden="true"><use href="#i-${a.external ? 'external' : 'arrow-right'}"/></svg>`;
const opensNew = (a) => a.external || newtab.checked;
const linkAttrs = (a) => `${a.url ? `href="${a.url}"` : 'aria-disabled="true"'}${opensNew(a) ? ' target="_blank" rel="noopener"' : ''}`;
// Lien public (Vitrine pro) : bouton « Copier le lien », au-dessus du lien étiré de la ligne.
const copyBtn = (a) => a.share
  ? `<button class="copy" type="button" data-copy="${a.share}" title="Copier le lien public"><svg class="ic" aria-hidden="true"><use href="#i-link"/></svg><span class="sr-only">Copier le lien public de ${a.name}</span></button>`
  : '';
const pubTag = (a) => (a.public ? '<span class="pub">Public</span>' : '');

function itemHtml(a, i, last) {
  const down = stateOf(a) === 'down' ? ' is-down' : '';
  const lastBadge = a.id === last ? '<span class="last">Dernière</span>' : '';
  const label = `${a.name}, ${a.role}. ${a.external ? 'S’ouvre sur Vercel' : a.public ? 'Public' : LABELS[stateOf(a)]}`;
  // La ligne entière est cliquable par un lien « étiré » (::after) ; le bouton de copie passe au-dessus.
  const link = `<a class="row-link" ${linkAttrs(a)} aria-label="${label}">${a.name}</a>`;
  if (view === 'grid') {
    return `<div class="tile${down}" data-i="${i}" style="--app:${a.color}">
      <span class="k">${a.key}</span>${icon(a, 'at-appicon--lg')}
      <span class="tile-text"><span class="name">${link}</span>${lastBadge}<span class="role">${a.role}</span></span>
      <span class="foot">${stateOf(a) === 'up' ? `<span class="ms">${msHtml(a)}</span>` : stateHtml(a, true)}${pubTag(a)}${copyBtn(a)}</span></div>`;
  }
  return `<div class="at-row${down}" data-i="${i}" style="--app:${a.color}" role="listitem">
    <span class="k">${a.key}</span>${icon(a)}
    <span class="name-role"><span class="name">${link}${pubTag(a)}${lastBadge}</span><span class="role">${a.role}</span></span>
    ${stateHtml(a)}<span class="ms">${msHtml(a)}</span>${a.share ? copyBtn(a) : goIcon(a)}</div>`;
}

// Ce qui a le focus dans la liste (lien d'une app ou son bouton de copie), pour le lui rendre après un nouveau rendu :
// la vérification de l'état redessine la liste toutes les 20 s.
function focusedItem() {
  const el = document.activeElement;
  const item = el && content.contains(el) ? el.closest('[data-i]') : null;
  return item ? { id: visible[Number(item.dataset.i)]?.id, copy: el.matches('[data-copy]') } : null;
}
function restoreFocus(kept) {
  const i = kept ? visible.findIndex((a) => a.id === kept.id) : -1;
  if (i < 0) return;
  const item = content.querySelector(`[data-i="${i}"]`);
  (kept.copy && item.querySelector('[data-copy]') || item.querySelector('.row-link'))?.focus({ preventScroll: true });
}

function render() {
  const term = q.value.trim();
  const kept = focusedItem();
  visible = selectApps();
  sel = Math.min(sel, Math.max(visible.length - 1, 0));
  const last = store.get('atelier:last');
  $('#title').textContent = term ? `Résultats pour « ${term} »` : TITLES[filter];
  document.querySelectorAll('[data-filter]').forEach((b) => b.setAttribute('aria-current', String(!term && b.dataset.filter === filter)));
  document.querySelectorAll('[data-view]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === view)));

  const counts = { all: APPS.length, recent: recents().length, incidents: APPS.filter(isIncident).length };
  GROUPS.forEach((g) => (counts[g.id] = APPS.filter((a) => a.grp === g.id).length));
  document.querySelectorAll('[data-count]').forEach((c) => {
    const n = counts[c.dataset.count];
    c.textContent = n || '';
    c.classList.toggle('at-count--alert', c.dataset.count === 'incidents' && n > 0);
  });

  if (!visible.length) {
    content.innerHTML = term
      ? `<div class="empty"><strong>Aucune app ne correspond à « ${term.replace(/[<>&"]/g, '')} »</strong>Cherche par nom ou par rôle : « budget », « films », « agent »…<br><button class="at-btn" type="button" data-clear>Effacer la recherche</button></div>`
      : filter === 'incidents'
        ? `<div class="empty"><strong>Aucun incident</strong>Toutes les apps du serveur répondent.</div>`
        : `<div class="empty"><strong>Pas encore d’app récente</strong>Les apps que tu ouvres depuis le portail apparaîtront ici.</div>`;
    return;
  }

  // Regroupement : par groupe pour « toutes » et « incidents », liste plate sinon.
  const grouped = !term && (filter === 'all' || filter === 'incidents');
  const sections = grouped
    ? GROUPS.map((g) => ({ g, apps: visible.filter((a) => a.grp === g.id) })).filter((s) => s.apps.length)
    : [{ g: null, apps: visible }];
  let i = 0;
  const order = [];
  content.innerHTML = sections.map(({ g, apps }) => {
    const head = g ? `<div class="at-ghead"><b>${g.title}</b><span class="at-count">${apps.length}</span><span>${g.note}</span></div>` : '';
    const items = apps.map((a) => { order.push(a); return itemHtml(a, i++, last) }).join('');
    return head + (view === 'grid' ? `<div class="tiles">${items}</div>` : `<div role="list">${items}</div>`);
  }).join('');
  visible = order;
  paintSel(false);
  restoreFocus(kept);
}

function items() { return [...content.querySelectorAll('[data-i]')] }
const finePointer = matchMedia('(hover: hover)').matches;
let usedKeys = false;
function paintSel(scroll = true) {
  const show = finePointer || usedKeys;
  items().forEach((el) => el.classList.toggle('is-sel', show && Number(el.dataset.i) === sel));
  const el = content.querySelector(`[data-i="${sel}"]`);
  if (scroll && el) el.scrollIntoView({ block: 'nearest' });
}
function cols() {
  if (view !== 'grid') return 1;
  const grid = content.querySelector('.tiles');
  return grid ? getComputedStyle(grid).gridTemplateColumns.split(' ').length : 1;
}
function open(a, forceNew = false) {
  if (!a || !a.url) return;
  noteOpen(a);
  if (forceNew || opensNew(a)) window.open(a.url, '_blank', 'noopener'); else location.assign(a.url);
}

content.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-i]');
  if (el && Number(el.dataset.i) !== sel) { sel = Number(el.dataset.i); paintSel(false) }
});
content.addEventListener('click', (e) => {
  if (e.target.closest('[data-clear]')) { q.value = ''; render(); q.focus(); return }
  const copy = e.target.closest('[data-copy]');
  if (copy) { e.preventDefault(); copyLink(copy.dataset.copy, copy); return }
  const el = e.target.closest('[data-i]');
  if (el && e.target.closest('a')) noteOpen(visible[Number(el.dataset.i)]);
});

// ── Copier un lien public (Vitrine pro) ──
async function copyLink(url, btn) {
  let ok = false;
  try { await navigator.clipboard.writeText(url); ok = true } catch {
    const t = document.createElement('textarea');
    t.value = url; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { ok = document.execCommand('copy') } catch {}
    t.remove();
  }
  $('#notice').textContent = ok ? `Lien copié : ${url}` : `Copie impossible : ${url}`;
  if (btn) {
    btn.classList.add('is-done');
    btn.querySelector('use')?.setAttribute('href', ok ? '#i-check' : '#i-x');
    setTimeout(() => { btn.classList.remove('is-done'); btn.querySelector('use')?.setAttribute('href', '#i-link') }, 1600);
  }
  clearTimeout(copyLink.t);
  copyLink.t = setTimeout(() => ($('#notice').textContent = ''), 4000);
}

document.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.filter; store.set('atelier:filter', filter); q.value = ''; sel = 0; render();
}));
document.querySelectorAll('[data-view]').forEach((b) => b.addEventListener('click', () => {
  view = b.dataset.view; store.set('atelier:view', view); render();
}));
q.addEventListener('input', () => { sel = 0; render() });

document.addEventListener('keydown', (e) => {
  const inSearch = e.target === q;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); q.select(); return }
  if (e.key === '/' && !inSearch) { e.preventDefault(); q.focus(); return }
  if (e.key === 'Escape' && inSearch) { if (q.value) { q.value = ''; render() } else q.blur(); return }
  const step = { ArrowDown: cols(), ArrowUp: -cols(), ArrowRight: view === 'grid' ? 1 : 0, ArrowLeft: view === 'grid' ? -1 : 0 }[e.key];
  if (step !== undefined && step !== 0 && (inSearch ? e.key.startsWith('Arrow') && (e.key === 'ArrowDown' || e.key === 'ArrowUp') : !e.target.closest('input,button,a,textarea'))) {
    e.preventDefault(); usedKeys = true; sel = Math.max(0, Math.min(visible.length - 1, sel + step)); paintSel(); return;
  }
  if (e.key === 'Enter' && (inSearch || !e.target.closest('input,button,a,textarea'))) {
    e.preventDefault(); open(visible[sel], e.metaKey || e.ctrlKey); return;
  }
  if (inSearch || e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input,textarea')) return;
  if (e.key === 'c' && visible[sel]?.share) { copyLink(visible[sel].share, content.querySelector(`[data-i="${sel}"] [data-copy]`)); return }
  if (/^[0-9]$/.test(e.key)) open(APPS.find((a) => a.key === e.key));
});

// ── État du serveur ──
const refreshBtn = $('#refresh');
// La zone annoncée aux lecteurs d'écran ne change que si l'état change : l'heure de la vérification est à côté.
function setHealth(html, time = '') {
  const state = $('#health-state');
  if (state.dataset.html !== html) { state.innerHTML = html; state.dataset.html = html }
  $('#health-time').textContent = time;
}
async function refresh() {
  refreshBtn.classList.add('is-busy');
  try {
    const res = await fetch('/api/statut', { cache: 'no-store' });
    if (res.status === 401) return location.assign('/connexion');
    const data = await res.json();
    statuses = Object.fromEntries(data.apps.map((s) => [s.id, s]));
    const total = data.apps.length;
    const up = data.apps.filter((s) => s.state === 'up').length;
    const worst = data.apps.some((s) => s.state === 'down') ? 'down' : up < total ? 'partial' : 'up';
    const time = new Date(data.at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    setHealth(`<span class="at-state" data-s="${worst}"></span><b class="num">${up} sur ${total}</b> en ligne`, time);
    $('#health').title = worst === 'up' ? 'Toutes les apps du serveur répondent' : `${total - up} app(s) du serveur ne répondent pas entièrement`;
    render();
  } catch {
    setHealth(`<span class="at-state" data-s="down"></span>État impossible à vérifier`);
  } finally {
    refreshBtn.classList.remove('is-busy');
  }
}
refreshBtn.addEventListener('click', refresh);

render();
requestAnimationFrame(() => $('#main').classList.add('is-ready'));
refresh();
setInterval(() => { if (!document.hidden) refresh() }, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh() });
</script>
</body>
</html>
