<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion · Suite Atelier</title>
<link rel="icon" type="image/png" href="/icones/favicon-64.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-title" content="Suite Atelier">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f8f4ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script>
(function(){
  var m = document.cookie.match(/(?:^|; )atelier_theme=(light|dark|system)/);
  var pref = m ? m[1] : 'system';
  var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();
</script>
<link rel="stylesheet" href="/atelier.css?v=2">
<style>
body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
main { width: min(100%, 340px); display: flex; flex-direction: column; gap: 24px; }
.mark { width: 40px; height: 40px; }
h1 { font-size: var(--t-page); font-weight: 600; letter-spacing: -0.012em; margin: 0; }
.lede { margin: 6px 0 0; color: var(--muted); font-size: var(--t-strong); }
form { display: flex; flex-direction: column; gap: 14px; }
.at-btn--primary { width: 100%; margin-top: 4px; }
footer { color: var(--faint); font-size: var(--t-small); text-align: center; }
</style>
</head>
<body>
{{ICONES}}
<main>
  <div>
    <svg class="mark" aria-hidden="true"><use href="#atelier-mark"/></svg>
  </div>
  <div>
    <h1>Connexion à la Suite Atelier</h1>
    <p class="lede">Une seule connexion pour toutes les apps de ton serveur.</p>
  </div>
  {{ERREUR}}
  <form method="post" action="/connexion">
    <input type="hidden" name="retour" value="{{RETOUR}}">
    <label class="at-field">Identifiant<input class="at-input" name="utilisateur" autocomplete="username" required value="{{IDENT}}"{{FOCUS_IDENT}}></label>
    <label class="at-field">Mot de passe<input class="at-input" name="mot_de_passe" type="password" autocomplete="current-password" required{{FOCUS_MDP}}{{INVALIDE}}></label>
    <button class="at-btn at-btn--primary at-btn--lg" type="submit">Se connecter</button>
  </form>
  <footer>{{DOMAINE}}</footer>
</main>
</body>
</html>
