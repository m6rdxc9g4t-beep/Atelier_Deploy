<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connexion · Suite Atelier</title>
<link rel="icon" type="image/png" href="/icones/favicon-64.png?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-title" content="Suite Atelier">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap">
<style>
:root{
  --bg:#FAF7F4; --surface:#FFFFFF; --fg:#1E1611; --muted:#6B5D54; --faint:#A39388;
  --line:rgba(34,20,13,.14); --grid:rgba(34,20,13,.045); --accent:#E8590C; --error:#B42318;
  --f-display:"Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --f-body:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0F0C0A; --surface:#17120F; --fg:#F4ECE6; --muted:#B3A398; --faint:#76665C;
  --line:rgba(255,236,224,.14); --grid:rgba(255,236,224,.035); --error:#FF8A80;
}}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;
  color:var(--fg);font:15px/1.5 var(--f-body);
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,
    var(--bg);
}
main{width:min(100%,380px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 20px 60px -30px rgba(232,89,12,.45)}
.mark{display:block;width:56px;height:56px;filter:drop-shadow(0 0 10px rgba(63,216,255,.35))}
h1{font:900 26px/1.1 var(--f-display);margin:0}
h1 span{color:var(--faint);font-weight:800}
p.lede{margin:-12px 0 0;color:var(--muted)}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
input{font:16px var(--f-body);color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
button{font:800 16px var(--f-display);color:#fff;background:var(--accent);border:0;border-radius:12px;padding:12px;cursor:pointer;margin-top:4px}
button:hover,button:focus-visible{filter:brightness(1.07);outline:none}
.error{margin:0;color:var(--error);font-size:14px;font-weight:600}
</style>
</head>
<body>
<main>
  <img class="mark" src="/icones/logo-96.png?v=1" alt="" width="56" height="56">
  <h1>Suite <span>Atelier</span></h1>
  <p class="lede">Une connexion pour Nexus, Viz, Tab et Projets.</p>
  {{ERREUR}}
  <form method="post" action="/connexion">
    <input type="hidden" name="retour" value="{{RETOUR}}">
    <label>Identifiant<input name="utilisateur" autocomplete="username" required autofocus></label>
    <label>Mot de passe<input name="mot_de_passe" type="password" autocomplete="current-password" required></label>
    <button type="submit">Se connecter</button>
  </form>
</main>
</body>
</html>
